<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>الدودة الجائعة</title><style>html,body{margin:0;height:100%;background:#101014;overflow:hidden}#app{height:100%}</style></head><body><div id="app"></div><script>const SKINS = [
  { name: 'العنكبوت الأحمر', c1: '#d8222f', c2: '#2a4fd0', dark: '#7a0f18', pat: 'web' },
  { name: 'فينوم', c1: '#17171c', c2: '#2b2b34', dark: '#050507', pat: 'goo', big: true },
  { name: 'مايلز', c1: '#1c1c24', c2: '#e01e46', dark: '#08080c', pat: 'band' },
  { name: 'جوست', c1: '#f2f2f7', c2: '#e8479d', dark: '#9a9aae', pat: 'band' },
  { name: 'كارنيج', c1: '#8f1d18', c2: '#1a1a1e', dark: '#4a0b09', pat: 'vein' },
  { name: 'الجوبلين', c1: '#23913f', c2: '#8a45d8', dark: '#0f4b21', pat: 'band' },
];
const THEMES = [
  { bg: '#7a4650', a: '#86525c', b: '#6c3d47' },
  { bg: '#101014', a: '#1a1a20', b: '#0b0b0e' },
  { bg: '#9a8296', a: '#a48ca0', b: '#8e7690' },
  { bg: '#1d4f9a', a: '#2559ab', b: '#174488' },
  { bg: '#4b8a3c', a: '#559846', b: '#417b34' },
  { bg: '#4a3a86', a: '#54438f', b: '#3f3179' },
];
const NAMES = ['زغلول', 'كوكي', 'سوسن', 'فلفل', 'بومة', 'سكر', 'لولو', 'تمساح', 'نمنم', 'برقوق', 'قمر', 'عسل'];
const WORLD = 3200, MARGIN = 110, FOOD_N = 400, BOTS = 11, ROUND = 600;
const R = (a, b) => a + Math.random() * (b - a);
const C = (v, a, b) => Math.max(a, Math.min(b, v));

function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
function eyes(x, ctx, cx, cy, s) {
  for (const sd of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx + sd * s * 0.42, cy, s * 0.32, s * 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#16161e'; ctx.beginPath(); ctx.arc(cx + sd * s * 0.42, cy + s * 0.06, s * 0.16, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + sd * s * 0.42 - s * 0.05, cy - s * 0.04, s * 0.05, 0, 7); ctx.fill();
  }
}
function sprites() {
  const S = 64, out = [];
  const blob = (col, dk, horn) => mk(S, S, (c) => {
    c.fillStyle = dk; c.beginPath(); c.ellipse(32, 36, 24, 22, 0, 0, 7); c.fill();
    c.fillStyle = col; c.beginPath(); c.ellipse(32, 33, 23, 21, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(24, 22, 9, 5, -0.5, 0, 7); c.fill();
    if (horn) { c.fillStyle = dk; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(32 + s * 10, 15); c.lineTo(32 + s * 18, 3); c.lineTo(32 + s * 19, 17); c.fill(); } }
    eyes(0, c, 32, 30, 22);
    c.strokeStyle = dk; c.lineWidth = 2.5; c.lineCap = 'round'; c.beginPath(); c.arc(32, 41, 6, 0.2, Math.PI - 0.2); c.stroke();
  });
  out.push(blob('#7ee05a', '#3c8e2a'), blob('#ff7b5c', '#b53d27', true), blob('#c35cf0', '#6d2b9a'), blob('#4fd6e6', '#1f8794'), blob('#ff6fae', '#b8326f', true), blob('#ffd44d', '#b8871a'));
  out.push(mk(S, S, (c) => { c.fillStyle = '#c92a2a'; c.beginPath(); c.arc(32, 38, 22, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(23, 28, 7, 4, -0.6, 0, 7); c.fill(); c.fillStyle = '#3f9a2f'; c.beginPath(); c.ellipse(36, 13, 11, 5, -0.5, 0, 7); c.fill(); c.strokeStyle = '#5a3a1a'; c.lineWidth = 3; c.beginPath(); c.moveTo(32, 18); c.lineTo(31, 8); c.stroke(); }));
  out.push(mk(S, S, (c) => { for (const x of [22, 42]) { c.strokeStyle = '#3f8a2f'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, 40); c.quadraticCurveTo(32, 8, 36, 6); c.stroke(); c.fillStyle = '#d62839'; c.beginPath(); c.arc(x, 44, 12, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.arc(x - 4, 40, 3.5, 0, 7); c.fill(); } }));
  out.push(mk(S, S, (c) => { c.fillStyle = '#e7a81e'; c.beginPath(); c.moveTo(6, 46); c.lineTo(54, 18); c.lineTo(58, 46); c.closePath(); c.fill(); c.fillStyle = '#ffd24a'; c.beginPath(); c.moveTo(6, 46); c.lineTo(54, 18); c.lineTo(54, 30); c.lineTo(10, 54); c.closePath(); c.fill(); c.fillStyle = '#d19015'; for (const [x, y, r] of [[32, 36, 4], [44, 30, 3], [22, 44, 3]]) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); } }));
  out.push(mk(S, S, (c) => { c.fillStyle = '#a8651f'; c.beginPath(); c.ellipse(32, 34, 25, 18, 0, 0, 7); c.fill(); c.fillStyle = '#e5a548'; c.beginPath(); c.ellipse(32, 31, 22, 15, 0, 0, 7); c.fill(); c.strokeStyle = '#b87326'; c.lineWidth = 2.5; for (const x of [20, 32, 44]) { c.beginPath(); c.moveTo(x - 3, 22); c.lineTo(x + 3, 40); c.stroke(); } }));
  out.push(mk(S, S, (c) => { c.fillStyle = '#e55c1a'; c.beginPath(); c.ellipse(32, 38, 24, 19, 0, 0, 7); c.fill(); c.strokeStyle = '#a63c08'; c.lineWidth = 2; for (const dx of [-12, -4, 4, 12]) { c.beginPath(); c.ellipse(32 + dx, 38, 5, 18, 0, 0, 7); c.stroke(); } c.fillStyle = '#3f8a2f'; c.fillRect(29, 12, 6, 10); }));
  return out;
}
function makeCoin() { return mk(64, 64, (c) => { const g = c.createRadialGradient(28, 26, 4, 32, 32, 30); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#e39a0c'); c.fillStyle = g; c.beginPath(); c.arc(32, 32, 28, 0, 7); c.fill(); c.strokeStyle = '#b8700a'; c.lineWidth = 4; c.stroke(); c.strokeStyle = '#c47c10'; c.lineWidth = 3; c.beginPath(); c.arc(32, 32, 20, 0, 7); c.stroke(); c.fillStyle = '#b8700a'; c.beginPath(); c.arc(25, 27, 3, 0, 7); c.arc(39, 27, 3, 0, 7); c.fill(); c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.arc(32, 33, 9, 0.2, Math.PI - 0.2); c.stroke(); }); }
function makePotion() { return mk(64, 64, (c) => { c.fillStyle = 'rgba(190,230,255,.55)'; c.strokeStyle = '#cfeaff'; c.lineWidth = 3; c.beginPath(); c.moveTo(26, 8); c.lineTo(38, 8); c.lineTo(38, 24); c.lineTo(54, 54); c.lineTo(10, 54); c.lineTo(26, 24); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#7a3ae0'; c.beginPath(); c.moveTo(20, 40); c.lineTo(44, 40); c.lineTo(50, 52); c.lineTo(14, 52); c.closePath(); c.fill(); c.fillStyle = '#8a5a2a'; c.fillRect(25, 3, 14, 7); }); }

function wormColor(sk, i) {
  if (sk.pat === 'band') return Math.floor(i / 3) % 2 ? sk.c2 : sk.c1;
  return sk.c1;
}
function drawWorm(ctx, pts, r, sk, heading, t) {
  const n = pts.length;
  ctx.lineJoin = 'round';
  for (let i = n - 1; i >= 0; i--) {
    const p = pts[i], k = 1 - (i / n) * 0.25, rr = r * (i === 0 ? 1.08 : k);
    ctx.fillStyle = sk.dark; ctx.beginPath(); ctx.arc(p.x, p.y + 1.5, rr + 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = wormColor(sk, i); ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(p.x - rr * 0.25, p.y - rr * 0.3, rr * 0.55, 0, 7); ctx.fill();
    if (i > 0 && i % 4 === 2) {
      if (sk.pat === 'web') { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.6, 0, 7); ctx.moveTo(p.x - rr, p.y); ctx.lineTo(p.x + rr, p.y); ctx.moveTo(p.x, p.y - rr); ctx.lineTo(p.x, p.y + rr); ctx.stroke(); }
      else if (sk.pat === 'goo') { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(p.x + rr * 0.3, p.y, rr * 0.22, 0, 7); ctx.fill(); }
      else if (sk.pat === 'vein') { ctx.fillStyle = sk.c2; ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.35, 0, 7); ctx.fill(); }
      else if (sk.pat === 'band') { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.3, 0, 7); ctx.fill(); }
    }
  }
  const h = pts[0], hr = r * 1.1, fx = Math.cos(heading), fy = Math.sin(heading), px = -fy, py = fx;
  if (sk.pat === 'web') { ctx.fillStyle = sk.c2; ctx.beginPath(); ctx.arc(h.x, h.y, hr * 0.98, 0, 7); ctx.fill(); ctx.fillStyle = sk.c1; ctx.beginPath(); ctx.arc(h.x - fx * hr * 0.2, h.y - fy * hr * 0.2, hr * 0.8, 0, 7); ctx.fill(); }
  for (const sd of [-1, 1]) {
    const ex = h.x + fx * hr * 0.4 + px * sd * hr * 0.5, ey = h.y + fy * hr * 0.4 + py * sd * hr * 0.5;
    ctx.fillStyle = '#fff';
    if (sk.big) { ctx.beginPath(); ctx.ellipse(ex, ey, hr * 0.5, hr * 0.7, heading + sd * 0.55, 0, 7); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.arc(ex, ey, hr * 0.42, 0, 7); ctx.fill();
      ctx.fillStyle = '#14141c'; ctx.beginPath(); ctx.arc(ex + fx * hr * 0.14, ey + fy * hr * 0.14, hr * 0.2, 0, 7); ctx.fill();
    }
  }
  if (!sk.big) { ctx.strokeStyle = sk.pat === 'band' && sk.c1 === '#f2f2f7' ? '#333' : 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x + fx * hr * 0.6, h.y + fy * hr * 0.6, hr * 0.4, heading + 1, heading + 2.1); ctx.stroke(); }
}

function mountGame(root, opts) {
  opts = opts || {};
  const st = document.createElement('style');
  st.textContent = `
.wz{position:relative;width:100%;height:${opts.full ? '100vh' : '520px'};background:#101014;overflow:hidden;border-radius:${opts.full ? '0' : '16px'};font-family:system-ui,"Segoe UI",Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;direction:ltr}
@media(min-width:768px){.wz{height:${opts.full ? '100vh' : '600px'}}}

.wz .boost:active,.wz .boost.hold{transform:scale(.93);filter:brightness(1.15)}
.wz .tb{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:8px}
.wz .rb{width:40px;height:40px;border-radius:50%;background:rgba(12,14,30,.72);border:2px solid #fff4;color:#fff;font-size:19px;cursor:pointer;padding:0;font-family:inherit}
.wz .joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);pointer-events:none;display:none}
.wz .joy b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9)}

.wz .panel h2{margin:0 0 6px;font-size:26px}.wz .panel p{margin:0 0 12px;font-size:14px;line-height:1.7;color:#cdd2f0}

.wz .sk{border:3px solid transparent;border-radius:12px;background:#262c58;padding:6px 2px;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.wz .sk.sel{border-color:#ffd54a;background:#303870}.wz .sk canvas{width:84px;height:36px}
.wz .go{width:100%;border:0;border-radius:14px;padding:14px;font-size:20px;font-weight:800;background:linear-gradient(#ffd54a,#f0a010);color:#2a1a00;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #a86a00}
.wz .go:active{transform:translateY(2px);box-shadow:0 2px 0 #a86a00}
.wz .hint{margin-top:10px;font-size:12.5px;line-height:1.7;color:#aab0d8}
`;
  root.appendChild(st);
  const wz = document.createElement('div'); wz.className = 'wz'; root.appendChild(wz);
  wz.innerHTML = `<canvas class="wz-main"></canvas>
<div class="lb"></div>
<div class="coin"><canvas width="76" height="76"></canvas><span>0</span></div>
<canvas class="mini" width="224" height="172"></canvas>
<div class="timer">10:00</div>
<div class="tb"><button class="rb" data-a="pause" aria-label="إيقاف">⏸</button><button class="rb" data-a="full" aria-label="ملء الشاشة">⛶</button></div>
<div class="pw"><button class="pwb" data-p="magnet">🧲<i>1</i></button><button class="pwb" data-p="speed">⏫<i>2</i></button><button class="pwb" data-p="zoom">🔍<i>2</i></button></div>
<button class="boost" aria-label="سرعة">⚡</button>
<div class="joy"><b></b></div>
<div class="ov"></div>`;
  const cv = wz.querySelector('.wz-main'), ctx = cv.getContext('2d');
  const lb = wz.querySelector('.lb'), scoreEl = wz.querySelector('.coin span'), timerEl = wz.querySelector('.timer');
  const mini = wz.querySelector('.mini'), mctx = mini.getContext('2d');
  const ov = wz.querySelector('.ov'), joy = wz.querySelector('.joy'), knob = joy.querySelector('b');
  const boostBtn = wz.querySelector('.boost');
  wz.querySelector('.coin canvas').getContext('2d').drawImage(makeCoin(), 0, 0, 76, 76);
  const SP = sprites(), COIN = makeCoin(), POT = makePotion();
  const pats = THEMES.map((t) => mk(140, 140, (c) => { c.fillStyle = t.bg; c.fillRect(0, 0, 140, 140); c.fillStyle = t.a; c.beginPath(); c.roundRect ? c.roundRect(10, 10, 120, 120, 26) : c.rect(10, 10, 120, 120); c.fill(); c.strokeStyle = t.b; c.lineWidth = 4; c.stroke(); c.fillStyle = t.b; c.globalAlpha = .5; c.beginPath(); c.arc(70, 70, 16, 0, 7); c.fill(); }));

  let G = null, skin = 0, best = 0, theme = 0, screen = 'menu', cssW = 0, cssH = 0, uiAt = 0;
  const input = { head: null, boost: false, mouse: false, joy: null };

  function newWorm(id, bot, name, sk, len) {
    const x = R(400, WORLD - 400), y = R(400, WORLD - 400), pts = [];
    for (let i = 0; i < len; i++) pts.push({ x: x - i * 10, y });
    return { id, bot, name, skin: sk, pts, heading: R(0, 6.28), tgt: R(0, 6.28), len, dead: false, respawn: 0, boost: false, aiT: 0, aiTarget: null, shield: bot ? 0 : 3 };
  }
  function food(x, y, big) {
    const r = Math.random(), kind = big ? 1 : (r < 0.03 ? 'coin' : r < 0.05 ? 'pot' : Math.floor(R(0, SP.length)));
    const k = kind === 'coin' ? 'coin' : kind === 'pot' ? 'pot' : 'n';
    return { x: x == null ? R(MARGIN, WORLD - MARGIN) : x, y: y == null ? R(MARGIN, WORLD - MARGIN) : y, k, s: k === 'n' ? SP[kind === 1 && big ? Math.floor(R(0, SP.length)) : kind] : (k === 'coin' ? COIN : POT), sz: k === 'n' ? (big ? 46 : R(34, 44)) : 44, v: k === 'coin' ? 6 : k === 'pot' ? 4 : (big ? 2.5 : 1), ph: R(0, 6.28) };
  }
  function init() {
    theme = Math.floor(R(0, THEMES.length));
    const worms = [newWorm(0, false, 'أنت', skin, 18)];
    for (let i = 0; i < BOTS; i++) worms.push(newWorm(i + 1, true, NAMES[i % NAMES.length], Math.floor(R(0, SKINS.length)), Math.floor(R(14, 50))));
    worms[0].pts.forEach((p, i) => { p.x = WORLD / 2 - i * 10; p.y = WORLD / 2; }); worms[0].heading = worms[0].tgt = 0;
    const foods = []; for (let i = 0; i < FOOD_N; i++) foods.push(food());
    G = { worms, foods, score: 0, time: 0, left: ROUND, over: false, paused: false, pw: { magnet: 1, speed: 2, zoom: 2 }, fx: { magnet: 0, speed: 0, zoom: 0 }, pop: [] };
    input.boost = false; input.head = null;
    refreshPw();
  }
  function refreshPw() {
    wz.querySelectorAll('.pwb').forEach((b) => { const k = b.dataset.p; b.querySelector('i').textContent = G ? G.pw[k] : 0; b.classList.toggle('off', !G || (G.pw[k] <= 0 && G.fx[k] <= 0)); b.classList.toggle('on', !!G && G.fx[k] > 0); });
  }
  const rad = (w) => 11 + Math.min(9, w.len / 45);
  const spd = (w) => (150 - Math.min(40, w.len / 6)) * (w.boost ? 1.7 : 1);

  function kill(w) {
    for (let i = 0; i < w.pts.length; i += 2) if (G.foods.length < FOOD_N + 300) G.foods.push(food(w.pts[i].x + R(-12, 12), w.pts[i].y + R(-12, 12), true));
    w.dead = true;
    if (w.bot) { w.respawn = G.time + R(2, 5); w.pts = []; }
    else { G.over = true; }
  }
  function aiUpdate(w, dt) {
    w.aiT -= dt; const h = w.pts[0];
    if (w.aiT <= 0) {
      w.aiT = R(0.25, 0.7); let best = null, bd = 520;
      for (const f of G.foods) { const d = Math.hypot(f.x - h.x, f.y - h.y) - f.v * 14; if (d < bd) { bd = d; best = f; } }
      w.aiTarget = best ? { x: best.x, y: best.y } : { x: R(MARGIN, WORLD - MARGIN), y: R(MARGIN, WORLD - MARGIN) };
    }
    let a = Math.atan2(w.aiTarget.y - h.y, w.aiTarget.x - h.x);
    if (Math.min(h.x, h.y, WORLD - h.x, WORLD - h.y) < 260) a = Math.atan2(WORLD / 2 - h.y, WORLD / 2 - h.x);
    const lx = h.x + Math.cos(w.heading) * 70, ly = h.y + Math.sin(w.heading) * 70;
    for (const o of G.worms) { if (o === w || o.dead) continue; for (let i = 0; i < o.pts.length; i += 3) { if (Math.abs(o.pts[i].x - lx) < 40 && Math.abs(o.pts[i].y - ly) < 40) { a = w.heading + 1.6; i = 1e9; } } }
