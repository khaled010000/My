<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خالد — مطوّر تطبيقات أندرويد وباحث قانوني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090d;
      --bg-elevated: #0f1118;
      --card: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --radius: 16px;
      --max-w: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
    }

    html[dir="ltr"] {
      font-family: 'Inter', 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.75;
      background: var(--bg);
    }

    /* خلفية متحركة ثابتة */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 16s ease-in-out infinite alternate;
    }

    .ambient-glow.one { top: -180px; inset-inline-end: -120px; }
    .ambient-glow.two { bottom: -220px; inset-inline-start: -140px; animation-delay: -8s; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-40px, 50px) scale(1.12); }
    }

    header, main, footer {
      position: relative;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* شريط التنقل */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(8, 9, 13, 0.75);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 600;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-select {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .lang-select:hover,
    .lang-select:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.09);
    }

    .lang-select option {
      background: #0f1118;
      color: #f3f4f6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.12);
    }

      background: var(--card);
      color: var
